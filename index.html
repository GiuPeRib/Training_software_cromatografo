<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulazione Software</title>

<style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Il contenitore occupa l'intero schermo */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        .screen-container {
            position: relative;
            display: inline-block;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* L'immagine ora si estende al 100% dello schermo */
        .screen-container img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain; /* Mantiene le proporzioni senza deformare */
            cursor: pointer;
        }

        /* Layer degli hotspot perfettamente in sincronia con l'immagine */
        #hotspot-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            border: 2px dashed rgba(255, 0, 0, 0); /* Lascialo 0.5 per i test */
            cursor: pointer;
            pointer-events: auto;
        }

        /* --- BARRA IN BASSO SOVRAPPOSTA --- */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 55px;
            width: 100%;
            background-color: rgba(0, 123, 255, 0.95); /* Azzurro vivido con leggera trasparenza */
            backdrop-filter: blur(5px); /* Leggero effetto sfocato sotto (opzionale ma bellissimo) */
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 300;
            color: white;
        }

        #bottom-bar .instruction-text {
            font-size: 1.1em;
            font-weight: bold;
            color: #f1f1f1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        #bottom-bar .status-icon {
            font-size: 1.2em;
        }

        /* --- MESSAGGIO CENTRALE (Corretto / Riprova) --- */
        #message {
            position: absolute; 
            top: 50%;           
            left: 50%;          
            transform: translate(-50%, -50%); 
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5em;
            z-index: 200;
            display: none;      
            pointer-events: none;
            white-space: nowrap; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #message.error { background: rgba(217, 83, 79, 0.95); color: white; }
        #message.success { background: rgba(92, 184, 92, 0.95); color: white; }

/* --- SCHERMATA DI AVVISO INIZIALE --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            transition: background 0.2s;
        }
        #start-btn:hover {
            background-color: #0056b3;
        }
    </style>

</head>

    let currentStep = 0;

function preloadImages() {
        steps.forEach(step => {
            if (step.image) {
                const img = new Image();
                img.src = step.image;
            }
           if (step.silentNextImage) {
                    // Creiamo un oggetto immagine in memoria invisibile
                    const tempImg = new Image();
                    tempImg.src = step.silentNextImage;
                    
                    // Appena l'immagine è pronta in memoria, la cambiamo di colpo
                    tempImg.onload = function() {
                        imgEl.src = step.silentNextImage;
                        hotspotLayer.innerHTML = ""; // Rimuove l'hotspot

                        if (step.advanceImmediately) {
                            setTimeout(() => {
                                currentStep++;
                                loadStep();
                            }, 200);
                        }
                    };
                    return;
                }
            if (step.autoSequence) {
                step.autoSequence.forEach(seq => {
                    const img = new Image();
                    img.src = seq.image;
                });
            }
        });
    }

function loadStep() {
     
        const step = steps[currentStep];
        const prevStep = steps[currentStep - 1];

        // --- AGGIUNTA --- Resetta la seconda immagine al cambio step
        const nextImgEl = document.getElementById("software-screen-next");
        nextImgEl.style.display = "none";
        nextImgEl.src = "";
        
        const instructionEl = document.getElementById("instruction");
        const imgEl = document.getElementById("software-screen");
        const hotspotLayer = document.getElementById("hotspot-layer");
        const messageEl = document.getElementById("message");
        const audio = document.getElementById('success-sound');

        // PULIZIA: nascondiamo il messaggio al cambio step
        messageEl.style.display = "none"; 
        hotspotLayer.innerHTML = "";

        // MODIFICA 1: Spegniamo l'audio SOLO se NON stiamo passando 
        // da "Priming_open_valve" a "Ending_priming"     
        const isTransitioningPriming = prevStep && prevStep.id === "Priming_open_valve" && step.id === "Ending_priming";
        
        // --- AGGIUNTA --- Se siamo già oltre "Verify_pump", l'audio deve restare acceso
        const isPastVerifyPump = prevStep && (prevStep.id === "Verify_pump" || prevStep.id.startsWith("New_sequence"));

        if (!isTransitioningPriming && !isPastVerifyPump) {
            audio.pause();
            audio.currentTime = 0;
            audio.onended = null;
            audio.loop = false;
        }
        
        if (currentStep >= steps.length - 1 && !step.image) {
            instructionEl.textContent = step.instruction;
            imgEl.style.display = "none";
            return;
        }

        instructionEl.textContent = step.instruction;
        imgEl.src = step.image;
        imgEl.style.display = "block";

        // MODIFICA 2: Se siamo atterrati su Ending_priming, assicuriamo che il loop continui
        if (step.id === "Ending_priming") {
            audio.loop = true;
            audio.play().catch(e => console.log("Audio bloccato:", e));
        }

        if (step.targetArea) {
            const hs = document.createElement("div");
            hs.className = "hotspot";
            hs.style.left = step.targetArea.left + "%";
            hs.style.top = step.targetArea.top + "%";
            hs.style.width = step.targetArea.width + "%";
            hs.style.height = step.targetArea.height + "%";
            
            hs.onclick = function(e) {
                e.stopPropagation();
                
                // SE QUESTO STEP DEVE CAMBIARE IN SILENZIO SENZA MESSAGGI:
                if (step.silentNextImage) {
                    // 1. Assegniamo la nuova immagine al secondo tag sovrapposto
                    nextImgEl.src = step.silentNextImage;
                    
                    // 2. La rendiamo visibile all'istante (essendo già precaricata, apparirà sopra la prima senza sfarfalli)
                    nextImgEl.style.display = "block";
                    
                    // 3. Rimuoviamo l'hotspot attuale
                    hotspotLayer.innerHTML = "";

                    // 4. Se deve avanzare subito di step
                    if (step.advanceImmediately) {
                        setTimeout(() => {
                            currentStep++;
                            loadStep();
                        }, 200);
                    }
                    return;
                }

                messageEl.textContent = "Corretto! Avanzamento...";
                messageEl.className = "success";
                messageEl.style.display = "block"; // Mostra il messaggio

                // 1. GESTIONE AUDIO SUI PASSAGGI SPECIFICI
                if (step.id === "Priming_open_valve") { 
                    let loopCount = 0;
                    audio.loop = true; 
                    audio.play();
                } 
                else if (step.id === "Ending_priming") {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.loop = false;
                }
                else if (step.id === "Verify_pump") {
                    // Se vuoi che parta/continui l'audio anche qui:
                    audio.addEventListener('timeupdate', function() {
                     // Se mancano meno di 0.2 secondi alla fine, riavvia subito
                    if (this.currentTime > (this.duration - 0.2)) {
                    this.currentTime = 0;
                    this.play();
                    }
});
                    audio.play().catch(err => console.log("Audio bloccato:", err));
                }

                // 2. GESTIONE DELLA SEQUENZA AUTOMATICA (per Verify_pump o altri step simili)
                if (step.autoSequence && step.autoSequence.length > 0) {
                    let seqIndex = 0;
                    
                    function playNextImage() {
                        if (seqIndex < step.autoSequence.length) {
                            let nextStepData = step.autoSequence[seqIndex];
                            
                            // Cambia l'immagine con la successiva della sequenza
                            imgEl.src = nextStepData.image;
                            
                            // Attende il delay configurato e passa alla prossima
                            setTimeout(() => {
                                seqIndex++;
                                playNextImage();
                            }, nextStepData.delay);
                            
                        } else {
                            // Finiti i passaggi automatici, avanziamo di step ma LASCIAMO ACCESO L'AUDIO
                            messageEl.style.display = "none";
                            currentStep++;
                            loadStep();
                        }
                    }

                    // Avvia la sequenza dopo un breve istante iniziale
                    setTimeout(() => {
                        playNextImage();
                    }, 800);

                } else {
                    // 3. COMPORTAMENTO STANDARD (per tutti gli altri step normali)
                    let tempoAttesa = (step.id === "Priming_open_valve") ? 800 : 1500;

                    setTimeout(() => {
                        currentStep++;
                        loadStep();
                    }, tempoAttesa);
                }
            };
            hotspotLayer.appendChild(hs);
        }
    }

    function checkMissClick(e) {
        const messageEl = document.getElementById("message");
        messageEl.textContent = "Riprova!";
        messageEl.className = "error";
        messageEl.style.display = "block"; // Mostra il messaggio

        // Nascondi il messaggio dopo 1.5 secondi
        setTimeout(() => {
            messageEl.style.display = "none";
        }, 1500);
    }

    // Avvia il primo step al caricamento della pagina
	function startSimulation() {

        // 1. Precarica tutte le immagini in silenzio
        preloadImages();

        // 2. Richiede al browser di andare in modalità Full Screen
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => {
                console.log("Fullscreen non consentito dal browser:", err);
            });
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }

        // 3. Nasconde la schermata di benvenuto
        document.getElementById("start-overlay").style.display = "none";

        // 4. Avvia effettivamente il primo step della simulazione
        loadStep();
    }

</script>
