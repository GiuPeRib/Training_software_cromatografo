<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulazione Software</title>

<style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        .screen-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: calc(100vh - 55px);
        }

        .screen-wrapper img {
            display: block;
            max-width: 100vw;
            max-height: calc(100vh - 55px);
            width: auto;
            height: auto;
            object-fit: contain;
            user-select: none;
            -webkit-user-select: none;
        }

        #hotspot-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            border: 2px dashed rgba(255, 0, 0, 0); /* Metti 0.5 se vuoi vederli per i test */
            cursor: pointer;
            pointer-events: auto;
        }

        /* --- BARRA IN BASSO SOVRAPPOSTA --- */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 55px;
            width: 100%;
            background-color: rgba(0, 123, 255, 0.95);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 300;
            color: white;
        }

        #bottom-bar .instruction-text {
            font-size: 1em;
            font-weight: bold;
            color: #f1f1f1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        #bottom-bar .status-icon {
            font-size: 1.2em;
        }

        /* --- MESSAGGIO CENTRALE --- */
        #message {
            position: absolute; 
            top: 50%;           
            left: 50%;          
            transform: translate(-50%, -50%); 
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5em;
            z-index: 400;
            display: none;      
            pointer-events: none;
            white-space: nowrap; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #message.error { background: rgba(217, 83, 79, 0.95); color: white; }
        #message.success { background: rgba(92, 184, 92, 0.95); color: white; }

        /* --- SCHERMATA DI AVVISO INIZIALE --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            transition: background 0.2s;
        }
        #start-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="start-overlay">
    <h2>Simulazione Software Interattiva</h2>
    <p>Clicca sul pulsante sottostante per avviare la simulazione.</p>
    <button id="start-btn" onclick="startSimulation()">Avvia Simulazione 🚀</button>
</div>

<div class="container" id="main-container">
    <div class="screen-wrapper" id="screen-wrapper">
        <img id="software-screen" src="" alt="Screenshot Software" onclick="checkMissClick(event)">
        <img id="software-screen-next" src="" alt="" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;">
        <div id="hotspot-layer"></div>
    </div>
    
    <div id="message"></div>

    <div id="bottom-bar">
        <div class="instruction-text" id="instruction">Caricamento simulazione...</div>
        <div class="status-icon">💡</div>
    </div>
</div>

<audio id="success-sound" src="Rumore cromatografo.m4a" preload="auto"></audio>

            autoSequence: [
                { image: "Inizio analisi 6.png", delay: 800 },

        },
        {

            advanceImmediately: true
        },
		{

            instruction: "L'analisi è terminata. Da dove apri il cromatogramma?",
            image: "Cromatogramma 2.png",
            targetArea: { left: 19.5, top: 24.5, width: 5.1, height: 2.6 },

                { image: "Cromatogramma 3.png", delay: 2000 },
            ]

            image: "Cromatogramma 3.png"
        }

    let currentStep = 0;
    let simulationFinished = false;

    function preloadImages() {
        steps.forEach(step => {
            if (step.image) { new Image().src = step.image; }
            if (step.silentNextImage) { new Image().src = step.silentNextImage; }
            if (step.autoSequence) {
                step.autoSequence.forEach(seq => { new Image().src = seq.image; });
            }
        });
    }

    function loadStep() {
        const step = steps[currentStep];
        const nextImgEl = document.getElementById("software-screen-next");
        nextImgEl.style.display = "none";
        nextImgEl.src = "";
        
        const instructionEl = document.getElementById("instruction");
        const imgEl = document.getElementById("software-screen");
        const hotspotLayer = document.getElementById("hotspot-layer");
        const messageEl = document.getElementById("message");
        const audio = document.getElementById('success-sound');

        messageEl.style.display = "none"; 
        hotspotLayer.innerHTML = "";

        if (!step) return;

        instructionEl.textContent = step.instruction;
        imgEl.src = step.image;
        imgEl.style.display = "block";

        if (currentStep === steps.length - 1) {
            simulationFinished = true;
            audio.pause(); // Spegne l'audio alla fine
            document.getElementById("screen-wrapper").style.cursor = "pointer";
            document.getElementById("screen-wrapper").onclick = function() {
                closeSimulation();
            };
            return;
        }

        if (step.targetArea) {
            const hs = document.createElement("div");
            hs.className = "hotspot";
            hs.style.left = step.targetArea.left + "%";
            hs.style.top = step.targetArea.top + "%";
            hs.style.width = step.targetArea.width + "%";
            hs.style.height = step.targetArea.height + "%";
            
            hs.onclick = function(e) {
                e.stopPropagation();
                
                if (step.silentNextImage) {
                    nextImgEl.src = step.silentNextImage;
                    nextImgEl.style.display = "block";
                    hotspotLayer.innerHTML = "";

                    if (step.advanceImmediately) {
                        setTimeout(() => {
                            currentStep++;
                            loadStep();
                        }, 200);
                    }
                    return;
                }

                messageEl.textContent = "Corretto! Avanzamento...";
                messageEl.className = "success";
                messageEl.style.display = "block";

                // Gestione audio al click sui target specifici
                if (step.id === "Priming_open_valve") { 
                    audio.loop = true; 
                    audio.play().catch(e => console.log("Audio bloccato:", e));
                } else if (step.id === "Ending_priming") {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.loop = false;
                } else if (step.id === "Verify_pump") {
                    audio.loop = true;
                    audio.play().catch(e => console.log("Audio bloccato:", e));
                }

                if (step.autoSequence && step.autoSequence.length > 0) {
                    let seqIndex = 0;
                    function playNextImage() {
                        if (seqIndex < step.autoSequence.length) {
                            let nextStepData = step.autoSequence[seqIndex];
                            imgEl.src = nextStepData.image;
                            setTimeout(() => {
                                seqIndex++;
                                playNextImage();
                            }, nextStepData.delay);
                        } else {
                            messageEl.style.display = "none";
                            currentStep++;
                            loadStep();
                        }
                    }
                    setTimeout(() => { playNextImage(); }, 800);
                } else {
                    let tempoAttesa = (step.id === "Priming_open_valve") ? 800 : 1500;
                    setTimeout(() => {
                        currentStep++;
                        loadStep();
                    }, tempoAttesa);
                }
            };
            hotspotLayer.appendChild(hs);
        }
    }

    function checkMissClick(e) {
        if (simulationFinished) return;
        const messageEl = document.getElementById("message");
        messageEl.textContent = "Riprova!";
        messageEl.className = "error";
        messageEl.style.display = "block";

        setTimeout(() => {
            messageEl.style.display = "none";
        }, 1500);
    }

    function closeSimulation() {
        window.close();
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
        document.getElementById("instruction").textContent = "Simulazione terminata. È possibile chiudere la scheda.";
    }

    function startSimulation() {
        preloadImages();
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        }
        document.getElementById("start-overlay").style.display = "none";
        loadStep();
    }
</script>

</body>
</html>
